name: Release Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/MAJOR/"
          minor_pattern: "/feat:/"
          version_format: "${major}.${minor}.${patch}"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.9"
          cache: true

      - name: Run tests
        run: go test ./...

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.9"
          cache: true

      - name: Build linux ${{ matrix.goarch }} binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o dist/tcp-tunnel-proxy-linux-${{ matrix.goarch }} cmd/tcp_tunnel_proxy/main.go

      - name: Create archive
        run: |
          cd dist
          tar -czf tcp-tunnel-proxy-linux-${{ matrix.goarch }}.tar.gz tcp-tunnel-proxy-linux-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-tunnel-proxy-linux-${{ matrix.goarch }}
          path: dist/tcp-tunnel-proxy-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs:
      - package
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tcp-tunnel-proxy-linux-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/tcp-tunnel-proxy-linux-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
